<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate | Plan a Trip</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <div class="login-container">
        <h1>Plan Your Trip ✈️</h1>
        <p>Fill in the details to organize your next adventure.</p>

        <form id="tripForm">

            <label for="destination">Destination</label>
            <input type="text" id="destination"
                   placeholder="Enter destination" required>

            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" required>

            <label for="endDate">End Date</label>
            <input type="date" id="endDate" required>

            <label for="travelers">Number of Travelers</label>
            <input type="number" id="travelers"
                   min="1" placeholder="Number of travelers" required>

            <label for="budget">Budget ($)</label>
            <input type="number" id="budget"
                   min="1" placeholder="Enter your budget" required>

            <button type="submit">Save Trip</button>

        </form>

        <p><a href="my-trips.html">View My Trips</a></p>
        <a href="index.html">Back to Home</a>
    </div>

</body>
</html>
